upstream django {
    # server unix:///mnt/c/Users/Admin/Desktop/project/work/Vadim/growskit/growskit.sock; # взаимодействие с uwsgi через Unix-сокет (мы воспользуемся этим вариантом позже) 
    server 127.0.0.1:8001; # взаимодействие с uwsgi через веб-порт 
}

server {
    # порт, который будет слушать веб-сервер в ожидании запросов от пользователй
    listen      443 ssl;
    # доменное имя
    server_name     0.0.0.0; # замените на собственный домен или IP адрес
    charset     utf-8;

    # максимальный размер загружаемых на сервер данных
    client_max_body_size 75M;  

    # обслуживание медиа файлов и статики
    location /media  {
        alias /mnt/c/Users/Admin/Desktop/project/work/Vadim/growskit/media;  # расположение медиафайлов (при необходимости измените)
    }

    location /static {
        alias /mnt/c/Users/Admin/Desktop/project/work/Vadim/growskit/main/static;  # расположение статики (при необходимости измените)
    }

    # SSL
    ssl_certificate /mnt/c/Users/Admin/Desktop/project/work/Vadim/growskit/certs/cert.txt;
    ssl_certificate_key /mnt/c/Users/Admin/Desktop/project/work/Vadim/growskit/certs/certificate.key;

    # Остальные запросы перенаправляются в Django приложение
    location / {
        uwsgi_pass  django;
        include     ./uwsgi_params; # файл uwsgi_params, который мы только что взяли с github
    }
}

