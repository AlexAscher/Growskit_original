upstream django {
    # server unix:///root/growskit/growskit/growskit.sock; # взаимодействие с uwsgi через Unix-сокет (мы воспользуемся этим вариантом позже) 
    server 127.0.0.1:8001; # взаимодействие с uwsgi через веб-порт 
}

server {
    listen      80;

    server_name     0.0.0.0; # замените на собственный домен или IP адрес

    return 301 https://$host$request_uri;
}

server {
    # порт, который будет слушать веб-сервер в ожидании запросов от пользователй
    listen      443 ssl;
    # доменное имя
    server_name     0.0.0.0; # замените на собственный домен или IP адрес
    charset     utf-8;

    # максимальный размер загружаемых на сервер данных
    client_max_body_size 75M;  

    # обслуживание медиа файлов и статики
    # location /media/  {
    #    alias /root/growskit/growskit/media/;  # расположение медиафайлов (при необходимости измените)
    #    allow all;
    #}

    # location /static/ {
    #     alias /root/growskit/growskit/main/static/;  # расположение статики (при необходимости измените)
    #    allow all;
    # }

    # SSL
    ssl_certificate /root/growskit/growskit/certs/cert.txt;
    ssl_certificate_key /root/growskit/growskit/certs/certificate.key;

    # Остальные запросы перенаправляются в Django приложение
    location / {
        uwsgi_pass  django;
        include     ./uwsgi_params; # файл uwsgi_params, который мы только что взяли с github
    }
}
