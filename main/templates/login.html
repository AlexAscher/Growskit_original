<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/static/css/login.css" />
    <link rel="stylesheet" href="/static/css/header.css" />
    <link rel="stylesheet" href="/static/css/reset.css" />
  </head>
  <body>
    <div
      class="container d-flex justify-content-center align-items-center vh-100"
    >
      <div class="login-form">
        <h2>Вход в личный кабинет</h2>
        <form method="post">
          {% csrf_token %}
        <input type="text" name="username" id="id_username"  placeholder="Логин" required/>
        <input type="password" name="password" id="id_password" placeholder="Пароль" required/>
        <div class="for-text">
          <div class="fornizh">
            <label class="custom-checkbox">
              <input type="checkbox" />
              <span class="checkmark"></span>
            </label>
            <span>Запомнить меня</span>
          </div>
          <a href="" class="firstA">Не помню пароль</a>
        </div>
        <button type="submit">Войти</button>
        <div class="forbottomlogin">
          <h3>Нет аккаунта?</h3>
          <a href="">Зарегистрироваться</a>
        </div>
        </form>
      </div>
    </div>
  </body>
</html>
