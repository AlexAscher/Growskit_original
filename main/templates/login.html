<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/static/css/login.css" />
    <link rel="stylesheet" href="/static/css/header.css" />
    <link rel="stylesheet" href="/static/css/reset.css" />
  </head>
  <body>
    <div
      class="container d-flex justify-content-center align-items-center vh-100"
    >
      <div class="login-form">
        <h2>Вход в личный кабинет</h2>
        <form method="post">
          {% csrf_token %}
          <input
            type="text"
            name="username"
            id="id_username"
            placeholder="Логин"
            required
          />
          <input
            type="password"
            name="password"
            id="id_password"
            placeholder="Пароль"
            required
          />
          <div class="for-text">
            <div class="fornizh">
              <label class="custom-checkbox">
                <input type="checkbox" />
                <span class="checkmark"></span>
              </label>
              <span>Запомнить меня</span>
            </div>
            <a href="#" class="firstA" id="forgotPasswordLink">Не помню пароль</a>
          </div>
          <button type="submit">Войти</button>
          <div class="forbottomlogin">
            <h3>Нет аккаунта?</h3>
            <a href="/uchastie/">Зарегистрироваться</a>
          </div>
        </form>
        {% if form.errors %}
            <p style="color: white;">{{ form.errors }}</p>
        {% endif %}
        <style>
          .errorlist{
            color: white;
          }
        </style>
      </div>
    </div>
    <!-- Подключение SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
    // Находим ссылку по ID
    const forgotPasswordLink = document.getElementById('forgotPasswordLink');

    // Добавляем обработчик клика
    forgotPasswordLink.addEventListener('click', function (event) {
        event.preventDefault(); // Предотвращаем переход по ссылке

        // Показываем уведомление с помощью SweetAlert2
        Swal.fire({
            title: 'Восстановление пароля',
            text: 'Для восстановления пароля свяжитесь с администратором.',
            icon: 'info', // Иконка уведомления (info, success, warning, error)
            confirmButtonText: 'Закрыть', // Текст кнопки
            customClass: {
                popup: 'custom-swal-popup' // Кастомный класс для стилизации
            }
        });
    });
});
    </script>
  </body>
</html>
